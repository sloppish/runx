[package]
name = "runx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
directories = "6.0"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
memchr = "2.7"
miette = { version = "7.6", features = ["fancy"] }
mlua = { version = "0.11.6", features = ["lua54", "send", "serde", "vendored"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "libc"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL"] }
plist = "1.7"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.35"
thread_local = "1.1"
tokio = { version = "1.48", features = ["rt-multi-thread", "time"] }
toml = "0.8"
tray-icon = "0.21"
walkdir = "2.5"
wry = { version = "0.55", features = ["transparent"] }

[patch.crates-io]
tao = { git = "https://github.com/sloppish/tao.git", rev = "c355c45d1323721e759eb7c3dde3fb9533b04e09" }

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
